      - kite-cluster-%s-%s.tar.gz
    ci_file_name_formats:
      - kite-cluster-latest-%s-%s.tar
      - kite-cluster-latest-%s-%s.tar.gz
  admin:
    name: admin
    release_roots:
      - offline/sealos-apps/admin/releases/
